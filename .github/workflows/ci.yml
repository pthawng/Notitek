name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notitek
          POSTGRES_PASSWORD: notitek
          POSTGRES_DB: notitek
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notitek -d notitek"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_DSN: postgres://notitek:notitek@localhost:5432/notitek?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Unit tests (race)
        run: go test -race ./...
      - name: Migrations apply and roll back
        run: make migrate-up migrate-down migrate-up
      - name: Integration tests
        run: make test-integration
      - name: Build all runtimes
        run: make build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/requirements-contract.txt
      - run: make contract

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        runtime: [api, worker, relay, scheduler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: RUNTIME=${{ matrix.runtime }}
          cache-from: type=gha,scope=${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runtime }}
